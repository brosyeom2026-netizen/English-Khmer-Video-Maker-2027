name: Build English Khmer Video Maker 2027

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Find Project & Build APK
        run: |
          echo "=== Repository Contents ==="
          find . -maxdepth 3 -not -path '*/.*'
          
          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle project files found in this repository! Please upload your app/, build.gradle, and settings.gradle files to GitHub."
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Found Gradle project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Khmer-Video-Maker-2027-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
