name: Build English Khmer Video Maker 2027

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Extract ZIP & Build APK
        run: |
          if [ -f "English-Khmer-Video-Maker-2027.zip" ]; then
            unzip -q -o English-Khmer-Video-Maker-2027.zip -d extracted_project
          fi

          GRADLE_FILE=$(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle project files found even after checking for ZIP files."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Khmer-Video-Maker-2027-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
